<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regia Testi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wdth,wght@87.5,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/asset/css/style.css">
    <style>

        html {
            height: 100%;
        }

        body {

            /* --- MODIFICATO --- */
            margin: 0; /* Rimuove il margine di default */
            padding: 20px; /* Mantiene la tua spaziatura originale */
            box-sizing: border-box; /* Include il padding nel calcolo dell'altezza */

            /* --- AGGIUNTO: Trasforma il body in un contenitore flex --- */
            display: flex;
            flex-direction: column; /* Dispone gli elementi in colonna */
            height: 100vh; /* Imposta l'altezza al 100% della finestra */
        }

        h1 {
            text-align: center;
            /* --- AGGIUNTO --- */
            margin-top: 0; /* Rimuove il margine superiore di default */
            flex-shrink: 0; /* Impedisce al titolo di rimpicciolirsi */
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            margin-top: 15px;
            font-size: 1.2rem;
            box-sizing: border-box;
            padding: 10px;
            background: rgb(29, 30, 38);
            border-radius: 10px;
            border: 2px solid #04439b;
            color: white;
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;

            /* --- AGGIUNTO --- */
            flex-shrink: 0; /* Impedisce ai bottoni di rimpicciolirsi */
        }

        button {
            padding: 15px;
            font-size: 1.5rem;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #inviaBtn {
            background-color: #007bff;
        }
        #inviaBtn:hover {
            background-color: #0056b3;
        }

        #svuotaBtn {
            background-color: #dc3545;
        }
        #svuotaBtn:hover {
            background-color: #c82333;
        }

        /* Toast notification (invariato) */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #28a745;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-size: 1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            background-color: #dc3545;
        }

        .toast.warning {
            background-color: #ffc107;
            color: #000;
        }
    </style>
</head>
<body class="noto-serif-sinhala-700">
<h1 style="color: white">Lyrics control panel</h1>

<textarea id="testoInput" class="noto-serif-sinhala-700" placeholder="Incolla o scrivi qui il testo del canto..."></textarea>

<div class="button-container">
    <button id="inviaBtn">Invia al Palco</button>
    <button id="svuotaBtn">Svuota Display</button>
</div>

<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
    // Il tuo Javascript rimane identico
    const socket = io();

    const testoInput = document.getElementById('testoInput');
    const inviaBtn = document.getElementById('inviaBtn');
    const svuotaBtn = document.getElementById('svuotaBtn');
    const toast = document.getElementById('toast');

    function mostraToast(messaggio, tipo = 'success') {
        toast.textContent = messaggio;
        toast.classList.remove('error', 'warning');

        if (tipo === 'error') {
            toast.classList.add('error');
        } else if (tipo === 'warning') {
            toast.classList.add('warning');
        }

        toast.classList.add('show');

        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    function inviaTesto() {
        const testo = testoInput.value.trim();

        if (testo === '') {
            mostraToast('⚠️ Inserisci del testo prima di inviare!', 'error');
            return;
        }

        socket.emit('invia-testo', testo);
        mostraToast('✓ Testo inviato al palco!');
    }

    function svuotaDisplay() {
        socket.emit('svuota-display');
        mostraToast('🗑️ Display svuotato', 'warning');
    }

    inviaBtn.addEventListener('click', inviaTesto);
    svuotaBtn.addEventListener('click', svuotaDisplay);

    socket.on('connect', () => {
        console.log('✓ Connesso al server');
    });

    socket.on('disconnect', () => {
        mostraToast('⚠️ Connessione persa!', 'error');
    });
</script>
</body>
</html>
