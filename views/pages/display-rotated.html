<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Palco Rotato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts - Noto Serif Sinhala -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        .noto-serif-sinhala {
            font-family: "Noto Serif Sinhala", serif;
            font-optical-sizing: auto;
            font-weight: 700;
            font-style: normal;
            font-variation-settings: "wdth" 100.5;
        }

        /* Container per la rotazione */
        #rotationWrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #container {
            transition: transform 0.3s ease;
        }

        #container.rotated {
            transform: rotate(90deg);
            width: 100vh;
            height: 100vw;
        }

        #container.normal {
            width: 100vw;
            height: 100vh;
        }

        #innerContainer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4%;
        }

        #testoDisplay {
            color: white;
            text-align: center;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;      
            line-height: 1.5; 
        }
    </style>
</head>
<body class="bg-[#0D0D0D]">
    
    <div id="rotationWrapper">
        <div id="container" class="rotated">
            <div id="innerContainer">
                <pre id="testoDisplay" class="noto-serif-sinhala fade-in">In attesa del testo dalla regia...</pre>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const testoDisplay = document.getElementById('testoDisplay');
        const container = document.getElementById('container');
        const innerContainer = document.getElementById('innerContainer');
        let isRotated = true;

        // Funzione per trovare la dimensione ottimale del font usando binary search
        function trovaFontSizeOttimale(elemento, testo) {
            // Range di ricerca: da 10px a 500px
            let minSize = 10;
            let maxSize = 500;
            let optimalSize = minSize;
            
            // Salva il testo originale
            const originalText = elemento.textContent;
            elemento.textContent = testo;
            
            // Binary search per trovare la dimensione massima che entra
            while (minSize <= maxSize) {
                const midSize = Math.floor((minSize + maxSize) / 2);
                elemento.style.fontSize = midSize + 'px';
                elemento.style.lineHeight = '1.4';
                
                // Forza il reflow per ottenere dimensioni accurate
                elemento.offsetHeight;
                
                const scrollWidth = elemento.scrollWidth;
                const scrollHeight = elemento.scrollHeight;
                const clientWidth = elemento.clientWidth;
                const clientHeight = elemento.clientHeight;
                
                // Controlla se il testo entra (con un margine di sicurezza di 2px)
                const fits = (scrollWidth <= clientWidth + 2) && (scrollHeight <= clientHeight + 2);
                
                if (fits) {
                    optimalSize = midSize;
                    minSize = midSize + 1;
                } else {
                    maxSize = midSize - 1;
                }
            }
            
            return optimalSize;
        }

        // Funzione per applicare il testo con dimensione ottimale
        function applicaTesto(testo) {
            testoDisplay.classList.remove('fade-in');
            
            // Trova la dimensione ottimale
            const fontSize = trovaFontSizeOttimale(testoDisplay, testo);
            
            // Applica il testo e le dimensioni
            testoDisplay.textContent = testo;
            testoDisplay.style.fontSize = fontSize + 'px';
            testoDisplay.style.lineHeight = '1.4';
            
            // Aggiungi animazione fade-in
            requestAnimationFrame(() => {
                testoDisplay.classList.add('fade-in');
            });
            
            console.log(`✓ Font size applicato: ${fontSize}px per ${testo.split('\n').length} righe (rotated: ${isRotated})`);
        }

        // Ricevi testo dal server
        socket.on('ricevi-testo', (testo) => {
            console.log('✓ Testo ricevuto:', testo);
            applicaTesto(testo);
        });
        
        // Svuota display
        socket.on('svuota-testo', () => {
            console.log('🗑️ Display svuotato');
            testoDisplay.classList.remove('fade-in');
            testoDisplay.style.fontSize = '40px';
            testoDisplay.style.lineHeight = '1.5';
            testoDisplay.textContent = 'In attesa del testo dalla regia...';
            requestAnimationFrame(() => {
                testoDisplay.classList.add('fade-in');
            });
        });
        
        // Gestione rotazione
        socket.on('set-rotation', (shouldRotate) => {
            console.log('🔄 Toggle rotazione:', shouldRotate);
            isRotated = shouldRotate;
            
            container.classList.remove('rotated', 'normal');
            container.classList.add(shouldRotate ? 'rotated' : 'normal');
            
            // Ricalcola dimensioni del testo dopo la rotazione
            setTimeout(() => {
                const testo = testoDisplay.textContent;
                if (testo !== 'In attesa del testo dalla regia...') {
                    applicaTesto(testo);
                }
            }, 350); // Aspetta che finisca l'animazione CSS
        });
        
        // Connection status
        socket.on('connect', () => console.log('✓ Display rotato connesso'));
        socket.on('disconnect', () => console.log('✗ Display rotato disconnesso'));

        // Ricalcola dimensioni al resize della finestra
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const testo = testoDisplay.textContent;
                if (testo !== 'In attesa del testo dalla regia...') {
                    applicaTesto(testo);
                }
            }, 100);
        });

        // Nascondi cursore dopo inattività
        let cursorTimeout;
        document.addEventListener('mousemove', () => {
            document.body.style.cursor = 'default';
            clearTimeout(cursorTimeout);
            cursorTimeout = setTimeout(() => {
                document.body.style.cursor = 'none';
            }, 3000);
        });

        // Inizializza con orientamento corretto
        window.addEventListener('load', () => {
            container.classList.add('rotated');
        });
    </script>
</body>
</html>
