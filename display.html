<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Palco</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #testoDisplay {
            font-size: 5vw;
            text-align: center;
            padding: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div id="testoDisplay">Waiting...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const testoDisplay = document.getElementById('testoDisplay');

        // Riceve il testo dalla regia
        socket.on('ricevi-testo', (testo) => {
            testoDisplay.innerText = testo;
            console.log('✓ Testo ricevuto:', testo);
        });
        
        // Riceve il comando di svuotare
        socket.on('svuota-testo', () => {
            testoDisplay.innerText = 'Waiting...';
            console.log('🗑️ Display svuotato');
        });
        
        socket.on('connect', () => {
            console.log('✓ Display connesso al server');
        });
    </script>
</body>
</html>
