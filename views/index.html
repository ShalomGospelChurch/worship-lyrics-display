<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Proiettore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center transition-colors p-4">
    
    <div class="w-full max-w-md">
        
        <!-- Card -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 p-8">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">
                    SGC | Lyrics Web-app
                </h1>
                <p class="text-gray-500 dark:text-gray-400">
                    Seleziona la modalità
                </p>
            </div>
            
            <!-- Links -->
            <div class="space-y-3">
                <a href="/control" 
                   class="block w-full px-6 py-4 bg-blue-600 hover:bg-blue-700 
                          text-white font-semibold rounded-lg text-center
                          transition-all transform hover:scale-105 active:scale-95
                          flex items-center justify-center gap-2">
                    <span>🔒</span>
                    <span>Control Panel</span>
                </a>
                
                <a href="/display" 
                   class="block w-full px-6 py-4 bg-green-600 hover:bg-green-700 
                          text-white font-semibold rounded-lg text-center
                          transition-all transform hover:scale-105 active:scale-95
                          flex items-center justify-center gap-2">
                    <span>🖥️</span>
                    <span>Display</span>
                
                </a>
                                <a href="/display-rotated" 
                   class="block w-full px-6 py-4 bg-green-600 hover:bg-green-700 
                          text-white font-semibold rounded-lg text-center
                          transition-all transform hover:scale-105 active:scale-95
                          flex items-center justify-center gap-2">
                    <span>🔄</span>
                    <span>Rotated-Display</span>
                </a>
            </div>
            
            <!-- Footer -->
            <div class="mt-8 text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400">
                    Shalom Gospel Church
                </p>
            </div>
        </div>
        
        <!-- Theme toggle (optional) -->
        <div class="mt-4 flex justify-center">
           <select id="themeSelect" 
                        class="px-3 py-1.5 text-sm bg-white dark:bg-gray-800 
                               border border-gray-300 dark:border-gray-700 
                               rounded-lg text-gray-900 dark:text-white
                               focus:ring-2 focus:ring-blue-500 focus:border-transparent
                               cursor-pointer ">
                    <option value="light">☀️ Chiaro</option>
                    <option value="dark">🌙 Scuro</option>
                    <option value="system">💻 Sistema</option>
                </select>
        </div>
    </div>
    
    <script src="https://kit.fontawesome.com/59da5544ae.js" crossorigin="anonymous"></script>
    <script>
        const html = document.documentElement;
        const themeSelect = document.getElementById('themeSelect');

        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            
            if (theme === 'system') {
                const systemTheme = getSystemTheme();
                html.classList.toggle('dark', systemTheme === 'dark');
            } else {
                html.classList.toggle('dark', theme === 'dark');
            }
        }

        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 'system';
        themeSelect.value = savedTheme;
        setTheme(savedTheme);

        themeSelect.addEventListener('change', (e) => {
            setTheme(e.target.value);
        });

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('theme') === 'system') {
                setTheme('system');
            }
        });
    </script>
</body>
</html>
