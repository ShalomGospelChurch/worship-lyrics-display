<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Utenti - SGC Lyrics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors p-4">
    
    <div class="container mx-auto max-w-6xl">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">👥 Gestione Utenti</h1>
                <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">Aggiungi, modifica o elimina utenti</p>
            </div>
            <div class="flex gap-2">
                <button id="addUserBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">
                    ➕ Nuovo Utente
                </button>
                <a href="/control" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg font-medium transition-colors">
                    ← Torna alla Regia
                </a>
            </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-100 dark:bg-gray-700">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 dark:text-gray-300 uppercase tracking-wider">Username</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 dark:text-gray-300 uppercase tracking-wider">Nome</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 dark:text-gray-300 uppercase tracking-wider">Ruolo</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-700 dark:text-gray-300 uppercase tracking-wider">Azioni</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="userModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-2xl max-w-md w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-xl font-bold text-gray-900 dark:text-white">Nuovo Utente</h2>
                <button id="closeModal" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 text-2xl">✕</button>
            </div>
            
            <form id="userForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
                    <input type="text" id="username" required 
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg
                                  bg-white dark:bg-gray-900 text-gray-900 dark:text-white
                                  focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome Completo</label>
                    <input type="text" id="name" required 
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg
                                  bg-white dark:bg-gray-900 text-gray-900 dark:text-white
                                  focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Ruolo</label>
                    <select id="role" required 
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg
                                   bg-white dark:bg-gray-900 text-gray-900 dark:text-white
                                   focus:ring-2 focus:ring-blue-500 focus:border-transparent cursor-pointer">
                        <option value="regia">Regia</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                
                <div id="passwordField">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                    <input type="password" id="password" 
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg
                                  bg-white dark:bg-gray-900 text-gray-900 dark:text-white
                                  focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Lascia vuoto per 'password123'">
                </div>
                
                <div class="flex gap-3 mt-6">
                    <button type="button" id="cancelBtn" 
                            class="flex-1 px-4 py-2 bg-gray-300 hover:bg-gray-400 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white rounded-lg font-medium transition-colors">
                        Annulla
                    </button>
                    <button type="submit" 
                            class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
                        Salva
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-2xl max-w-sm w-full p-6">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Conferma eliminazione</h2>
            <p class="text-gray-600 dark:text-gray-400 mb-6">Sei sicuro di voler eliminare l'utente <strong id="deleteUsername"></strong>?</p>
            
            <div class="flex gap-3">
                <button id="cancelDelete" 
                        class="flex-1 px-4 py-2 bg-gray-300 hover:bg-gray-400 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white rounded-lg font-medium transition-colors">
                    Annulla
                </button>
                <button id="confirmDelete" 
                        class="flex-1 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors">
                    Elimina
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-4 right-4 px-5 py-3 rounded-lg shadow-lg text-white z-50"></div>

    <script>
        const usersTableBody = document.getElementById('usersTableBody');
        const addUserBtn = document.getElementById('addUserBtn');
        const userModal = document.getElementById('userModal');
        const deleteModal = document.getElementById('deleteModal');
        const closeModal = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const userForm = document.getElementById('userForm');
        const modalTitle = document.getElementById('modalTitle');
        const passwordField = document.getElementById('passwordField');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');
        const deleteUsername = document.getElementById('deleteUsername');
        const toast = document.getElementById('toast');

        let editingUsername = null;
        let deletingUsername = null;

        // Load users
        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                
                usersTableBody.innerHTML = '';
                
                Object.entries(users).forEach(([username, user]) => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 dark:hover:bg-gray-700';
                    
                    const roleColor = user.role === 'admin' ? 'bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-300' : 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-300';
                    
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">${username}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 dark:text-gray-300">${user.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${roleColor}">
                                ${user.role}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="editUser('${username}')" class="text-blue-600 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300 mr-3">✏️ Modifica</button>
                            <button onclick="deleteUser('${username}')" class="text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300">🗑️ Elimina</button>
                        </td>
                    `;
                    
                    usersTableBody.appendChild(row);
                });
            } catch (err) {
                showToast('❌ Errore caricamento utenti', 'error');
            }
        }

        // Add user
        addUserBtn.addEventListener('click', () => {
            editingUsername = null;
            modalTitle.textContent = 'Nuovo Utente';
            passwordField.classList.remove('hidden');
            document.getElementById('username').disabled = false;
            userForm.reset();
            userModal.classList.remove('hidden');
        });

        // Edit user
        window.editUser = async (username) => {
            editingUsername = username;
            modalTitle.textContent = 'Modifica Utente';
            passwordField.classList.add('hidden');
            
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                const user = users[username];
                
                document.getElementById('username').value = username;
                document.getElementById('username').disabled = true;
                document.getElementById('name').value = user.name;
                document.getElementById('role').value = user.role;
                
                userModal.classList.remove('hidden');
            } catch (err) {
                showToast('❌ Errore caricamento utente', 'error');
            }
        };

        // Delete user
        window.deleteUser = (username) => {
            deletingUsername = username;
            deleteUsername.textContent = username;
            deleteModal.classList.remove('hidden');
        };

        // Confirm delete
        confirmDelete.addEventListener('click', async () => {
            try {
                const res = await fetch(`/api/admin/users/${deletingUsername}`, {
                    method: 'DELETE'
                });
                
                if (res.ok) {
                    showToast('✓ Utente eliminato', 'success');
                    loadUsers();
                    deleteModal.classList.add('hidden');
                } else {
                    const data = await res.json();
                    showToast(data.message || '❌ Errore eliminazione', 'error');
                }
            } catch (err) {
                showToast('❌ Errore server', 'error');
            }
        });

        // Cancel delete
        cancelDelete.addEventListener('click', () => {
            deleteModal.classList.add('hidden');
        });

        // Save user
        userForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;
            
            const endpoint = editingUsername ? `/api/admin/users/${editingUsername}` : '/api/admin/users';
            const method = editingUsername ? 'PUT' : 'POST';
            
            try {
                const res = await fetch(endpoint, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, name, role, password })
                });
                
                if (res.ok) {
                    showToast(editingUsername ? '✓ Utente aggiornato' : '✓ Utente creato', 'success');
                    loadUsers();
                    userModal.classList.add('hidden');
                } else {
                    const data = await res.json();
                    showToast(data.message || '❌ Errore salvataggio', 'error');
                }
            } catch (err) {
                showToast('❌ Errore server', 'error');
            }
        });

        // Close modals
        closeModal.addEventListener('click', () => userModal.classList.add('hidden'));
        cancelBtn.addEventListener('click', () => userModal.classList.add('hidden'));

        // Toast
        function showToast(message, type) {
            const colors = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                info: 'bg-blue-600'
            };
            
            toast.textContent = message;
            toast.className = `fixed bottom-4 right-4 px-5 py-3 rounded-lg shadow-lg text-white z-50 ${colors[type] || colors.info}`;
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Load users on page load
        loadUsers();
    </script>
</body>
</html>
