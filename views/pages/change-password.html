<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Cambia Password - SGC Lyrics</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">🔐 Cambia Password</h2>

    <form id="changeForm" class="space-y-4">
      <div>
        <label class="block mb-1 text-sm font-medium">Vecchia password</label>
        <input type="password" id="oldPassword" required class="w-full border rounded px-3 py-2">
      </div>
      <div>
        <label class="block mb-1 text-sm font-medium">Nuova password</label>
        <input type="password" id="newPassword" required class="w-full border rounded px-3 py-2">
      </div>
      <button class="w-full bg-blue-600 text-white rounded py-2 font-semibold">Aggiorna</button>
      <p id="message" class="text-center text-sm mt-3"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById('changeForm');
    const msg = document.getElementById('message');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const res = await fetch('/api/change-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ oldPassword, newPassword })
      });
      const data = await res.json();
      msg.textContent = data.message;
      msg.className = res.ok ? 'text-green-600' : 'text-red-600';
    });
  </script>
</body>
</html>
