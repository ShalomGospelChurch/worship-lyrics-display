<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regia Testi</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #f4f4f4;
            position: relative;
        }
        h1 { text-align: center; }
        textarea {
            width: 100%;
            height: 300px;
            font-size: 1.2rem;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #ddd;
        }
        
        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        button {
            flex: 1;
            padding: 15px;
            font-size: 1.5rem;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        #inviaBtn {
            background-color: #007bff;
        }
        #inviaBtn:hover { 
            background-color: #0056b3; 
        }
        
        #svuotaBtn {
            background-color: #dc3545;
        }
        #svuotaBtn:hover { 
            background-color: #c82333; 
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #28a745;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-size: 1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .toast.error {
            background-color: #dc3545;
        }
        
        .toast.warning {
            background-color: #ffc107;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>Pannello Regia Canti</h1>
    
    <textarea id="testoInput" placeholder="Incolla o scrivi qui il testo del canto..."></textarea>
    
    <div class="button-container">
        <button id="inviaBtn">Invia al Palco</button>
        <button id="svuotaBtn">Svuota Display</button>
    </div>
    
    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const testoInput = document.getElementById('testoInput');
        const inviaBtn = document.getElementById('inviaBtn');
        const svuotaBtn = document.getElementById('svuotaBtn');
        const toast = document.getElementById('toast');

        // Funzione per mostrare il toast
        function mostraToast(messaggio, tipo = 'success') {
            toast.textContent = messaggio;
            toast.classList.remove('error', 'warning');
            
            if (tipo === 'error') {
                toast.classList.add('error');
            } else if (tipo === 'warning') {
                toast.classList.add('warning');
            }
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Funzione per inviare il testo
        function inviaTesto() {
            const testo = testoInput.value.trim();
            
            if (testo === '') {
                mostraToast('⚠️ Inserisci del testo prima di inviare!', 'error');
                return;
            }
            
            socket.emit('invia-testo', testo);
            mostraToast('✓ Testo inviato al palco!');
        }

        // Funzione per svuotare il display
        function svuotaDisplay() {
            socket.emit('svuota-display');
            mostraToast('🗑️ Display svuotato', 'warning');
        }

        // Eventi
        inviaBtn.addEventListener('click', inviaTesto);
        svuotaBtn.addEventListener('click', svuotaDisplay);
        
        // Feedback connessione
        socket.on('connect', () => {
            console.log('✓ Connesso al server');
        });
        
        socket.on('disconnect', () => {
            mostraToast('⚠️ Connessione persa!', 'error');
        });
    </script>
</body>
</html>
