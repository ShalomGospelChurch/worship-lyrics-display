<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regia Testi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        h1 { text-align: center; }
        textarea {
            width: 100%;
            height: 300px;
            font-size: 1.2rem;
            box-sizing: border-box; /* Per includere padding e border nel width */
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.5rem;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Pannello Regia Canti</h1>
    
    <textarea id="testoInput" placeholder="Incolla o scrivi qui il testo del canto..."></textarea>
    <button id="inviaBtn">Invia al Palco</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); // Connessione al server

        const testoInput = document.getElementById('testoInput');
        const inviaBtn = document.getElementById('inviaBtn');

        // Funzione per inviare il testo
        function inviaTesto() {
            const testo = testoInput.value;
            // Invia il testo al server sull'evento 'invia-testo'
            socket.emit('invia-testo', testo);
        }

        // Invia al click del bottone
        inviaBtn.addEventListener('click', inviaTesto);
        
        // Invia anche mentre scrivi (per un feedback istantaneo)
        testoInput.addEventListener('input', () => {
            clearTimeout(testoInput.timer);
            testoInput.timer = setTimeout(inviaTesto, 200);
        });

    </script>
</body>
</html>
